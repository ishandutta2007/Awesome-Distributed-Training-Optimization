<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="slightGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6"/>
    </pattern>

    <style>
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.35); opacity: 0.3; }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -100; }
      }
      @keyframes floatParticle {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
        50% { transform: translateY(-12px) translateX(8px); opacity: 0.8; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      }
      @keyframes shimmerBorder {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 400; }
      }

      .pulse-ring-1 {
        transform-origin: 150px 100px;
        animation: pulseNode 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .pulse-ring-2 {
        transform-origin: 1050px 110px;
        animation: pulseNode 3.5s cubic-bezier(0.4, 0, 0.6, 1) infinite 0.7s;
      }
      .pulse-ring-3 {
        transform-origin: 980px 290px;
        animation: pulseNode 4s cubic-bezier(0.4, 0, 0.6, 1) infinite 1.4s;
      }
      .pulse-ring-4 {
        transform-origin: 120px 280px;
        animation: pulseNode 3.2s cubic-bezier(0.4, 0, 0.6, 1) infinite 1s;
      }
      .data-stream {
        stroke-dasharray: 8, 8;
        animation: dashMove 2.5s linear infinite;
      }
      .particle-slow {
        animation: floatParticle 5s ease-in-out infinite;
      }
      .border-flow {
        stroke-dasharray: 200, 200;
        animation: shimmerBorder 8s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="380" rx="16" fill="url(#grid)" />

  <!-- Ambient Light Orbs (Background layer) -->
  <circle cx="200" cy="180" r="180" fill="#3b82f6" opacity="0.08" filter="url(#glow)" />
  <circle cx="1000" cy="180" r="190" fill="#8b5cf6" opacity="0.08" filter="url(#glow)" />
  <circle cx="600" cy="80" r="140" fill="#ec4899" opacity="0.05" filter="url(#glow)" />

  <!-- Dynamic Distributed Network Architecture Lines (Behind Text) -->
  <g opacity="0.65">
    <!-- Interconnect Buses -->
    <path class="data-stream" d="M 80 100 L 260 140 L 420 80 L 780 80 L 940 140 L 1120 100" fill="none" stroke="url(#lineGrad1)" stroke-width="2" />
    <path class="data-stream" d="M 120 280 L 300 240 L 480 300 L 720 300 L 900 240 L 1080 280" fill="none" stroke="url(#lineGrad1)" stroke-width="2" style="animation-direction: reverse; animation-duration: 3.2s;" />
    <path class="data-stream" d="M 150 100 L 120 280 M 1050 110 L 980 290" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.4" />
    
    <!-- Cluster Computing Nodes (Left) -->
    <g transform="translate(150, 100)">
      <circle class="pulse-ring-1" cx="0" cy="0" r="18" fill="none" stroke="#38bdf8" stroke-width="2" />
      <circle cx="0" cy="0" r="7" fill="#38bdf8" filter="url(#slightGlow)" />
      <text x="-32" y="-14" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">GPU NODE 0</text>
    </g>

    <g transform="translate(120, 280)">
      <circle class="pulse-ring-4" cx="0" cy="0" r="16" fill="none" stroke="#818cf8" stroke-width="2" />
      <circle cx="0" cy="0" r="6" fill="#818cf8" filter="url(#slightGlow)" />
      <text x="-32" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">GPU NODE 1</text>
    </g>

    <!-- Cluster Computing Nodes (Right) -->
    <g transform="translate(1050, 110)">
      <circle class="pulse-ring-2" cx="0" cy="0" r="18" fill="none" stroke="#c084fc" stroke-width="2" />
      <circle cx="0" cy="0" r="7" fill="#c084fc" filter="url(#slightGlow)" />
      <text x="-25" y="-14" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">GPU NODE 2</text>
    </g>

    <g transform="translate(980, 290)">
      <circle class="pulse-ring-3" cx="0" cy="0" r="16" fill="none" stroke="#ec4899" stroke-width="2" />
      <circle cx="0" cy="0" r="6" fill="#ec4899" filter="url(#slightGlow)" />
      <text x="-25" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">GPU NODE 3</text>
    </g>

    <!-- Floating Data Packets -->
    <circle class="particle-slow" cx="340" cy="110" r="3.5" fill="#38bdf8" />
    <circle class="particle-slow" cx="860" cy="110" r="3.5" fill="#c084fc" style="animation-delay: 1.5s;" />
    <circle class="particle-slow" cx="600" cy="300" r="3" fill="#818cf8" style="animation-delay: 2.5s;" />
  </g>

  <!-- Foreground Content Container -->
  <!-- Top Badge / Pill -->
  <g transform="translate(600, 52)">
    <rect x="-195" y="-15" width="390" height="30" rx="15" fill="#1e293b" fill-opacity="0.85" stroke="#3b82f6" stroke-width="1.2" />
    <text text-anchor="middle" y="5" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.2">
      ⚡ DISTRIBUTED TRAINING &amp; COMPUTE ECOSYSTEM ⚡
    </text>
  </g>

  <!-- Main Title -->
  <g transform="translate(600, 135)">
    <text text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5" filter="drop-shadow(0px 3px 6px rgba(0,0,0,0.8))">
      Awesome Distributed Training
    </text>
    <text text-anchor="middle" y="44" fill="url(#primaryTextGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5" filter="url(#slightGlow)">
      Optimization
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 230)">
    <text text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" letter-spacing="0.2">
      Curated Guide to ZeRO Memory Sharding, 3D Parallelism, Multi-GPU Scaling &amp; Cloud Infrastructure
    </text>
  </g>

  <!-- Technology Badges in Foreground -->
  <g transform="translate(600, 300)">
    <!-- Pill 1: ZeRO & FSDP -->
    <g transform="translate(-360, 0)">
      <rect x="-80" y="-17" width="160" height="34" rx="8" fill="#1e1e2f" stroke="#38bdf8" stroke-width="1.2" fill-opacity="0.9" />
      <text text-anchor="middle" y="5" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🧠 ZeRO &amp; FSDP2</text>
    </g>

    <!-- Pill 2: 3D Parallelism -->
    <g transform="translate(-180, 0)">
      <rect x="-85" y="-17" width="170" height="34" rx="8" fill="#1e1e2f" stroke="#818cf8" stroke-width="1.2" fill-opacity="0.9" />
      <text text-anchor="middle" y="5" fill="#e0e7ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📐 3D Parallelism</text>
    </g>

    <!-- Pill 3: Megatron & Ray -->
    <g transform="translate(0, 0)">
      <rect x="-80" y="-17" width="160" height="34" rx="8" fill="#1e1e2f" stroke="#c084fc" stroke-width="1.2" fill-opacity="0.9" />
      <text text-anchor="middle" y="5" fill="#f3e8ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚡ Megatron &amp; Ray</text>
    </g>

    <!-- Pill 4: GPU Neoclouds -->
    <g transform="translate(180, 0)">
      <rect x="-85" y="-17" width="170" height="34" rx="8" fill="#1e1e2f" stroke="#f472b6" stroke-width="1.2" fill-opacity="0.9" />
      <text text-anchor="middle" y="5" fill="#fce7f3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">☁️ GPU Neoclouds</text>
    </g>

    <!-- Pill 5: High-Speed Fabric -->
    <g transform="translate(360, 0)">
      <rect x="-80" y="-17" width="160" height="34" rx="8" fill="#1e1e2f" stroke="#34d399" stroke-width="1.2" fill-opacity="0.9" />
      <text text-anchor="middle" y="5" fill="#d1fae5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🚀 NVLink &amp; InfiniBand</text>
    </g>
  </g>

  <!-- Sleek Outer Border Highlight -->
  <rect class="border-flow" x="1.5" y="1.5" width="1197" height="377" rx="15" fill="none" stroke="url(#primaryTextGrad)" stroke-width="1.5" opacity="0.6" />
</svg>
